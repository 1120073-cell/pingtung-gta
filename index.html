<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<title>高雄迷你 GTA</title>
<style>
  body { margin:0; background:#111; color:#fff; font-family:sans-serif; overflow:hidden; }
  canvas { display:block; }
  #hud {
    position:fixed; top:10px; left:10px;
    background:rgba(0,0,0,0.6); padding:10px 14px;
    border-radius:8px; font-size:14px; line-height:1.6;
  }
  #wanted { color:#ff4444; font-weight:bold; }
  #tip {
    position:fixed; bottom:10px; left:10px;
    background:rgba(0,0,0,0.6); padding:8px 12px;
    border-radius:8px; font-size:13px; color:#aaa;
  }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud">
  🚗 高雄迷你 GTA<br>
  通緝等級：<span id="wanted">0</span><br>
  分數：<span id="score">0</span>
</div>
<div id="tip">WASD / 方向鍵 開車 &nbsp;|&nbsp; 撞路人會增加通緝</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let W, H;
function resize(){ W = canvas.width = innerWidth; H = canvas.height = innerHeight; }
resize(); addEventListener('resize', resize);

// 地標資料（用色塊+文字表示）
const landmarks = [
  { x: 300, y: 200, w: 80, h: 160, color:'#3a7bd5', name:'85大樓' },
  { x: 900, y: 300, w: 140, h: 80, color:'#c0392b', name:'駁二' },
  { x: 600, y: 600, w: 120, h: 60, color:'#27ae60', name:'愛河' },
  { x: 1200, y: 500, w: 100, h: 100, color:'#8e44ad', name:'衛武營' },
  { x: 150, y: 700, w: 90, h: 90, color:'#e67e22', name:'西子灣' },
];

// 玩家車
const player = {
  x: W/2, y: H/2, angle: 0,
  speed: 0, maxSpeed: 5, accel: 0.15, friction: 0.96,
  turnSpeed: 0.05, w: 40, h: 22,
  color: '#f1c40f'
};

// 路人
const pedestrians = [];
for (let i=0;i<30;i++){
  pedestrians.push({
    x: Math.random()*2000+100, y: Math.random()*1200+100,
    alive: true, r: 6, color:'#ecf0f1'
  });
}

// 警察
const cops = [];
let wanted = 0;
let score = 0;

const keys = {};
addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

function spawnCop(){
  const angle = Math.random()*Math.PI*2;
  const dist = 600;
  cops.push({
    x: player.x + Math.cos(angle)*dist,
    y: player.y + Math.sin(angle)*dist,
    angle: 0, speed: 3.2,
    w: 40, h: 22, color:'#3498db'
  });
}

function update(){
  // 玩家控制
  if (keys['w'] || keys['arrowup']) player.speed += player.accel;
  if (keys['s'] || keys['arrowdown']) player.speed -= player.accel;
  if (keys['a'] || keys['arrowleft']) player.angle -= player.turnSpeed * (player.speed>0?1:-1);
  if (keys['d'] || keys['arrowright']) player.angle += player.turnSpeed * (player.speed>0?1:-1);

  player.speed *= player.friction;
  player.speed = Math.max(-player.maxSpeed, Math.min(player.maxSpeed, player.speed));

  player.x += Math.cos(player.angle) * player.speed;
  player.y += Math.sin(player.angle) * player.speed;

  // 世界邊界
  player.x = Math.max(0, Math.min(2000, player.x));
  player.y = Math.max(0, Math.min(1200, player.y));

  // 撞路人
  pedestrians.forEach(p => {
    if (!p.alive) return;
    const dx = p.x - player.x, dy = p.y - player.y;
    if (Math.hypot(dx, dy) < 25 && Math.abs(player.speed) > 2){
      p.alive = false;
      wanted = Math.min(5, wanted + 1);
      score += 10;
      document.getElementById('wanted').textContent = wanted;
      document.getElementById('score').textContent = score;
      // 每級通緝多一隻警察
      if (cops.length < wanted) spawnCop();
    }
  });

  // 警察追蹤
  cops.forEach(c => {
    const dx = player.x - c.x, dy = player.y - c.y;
    const dist = Math.hypot(dx, dy);
    c.angle = Math.atan2(dy, dx);
    if (dist > 30){
      c.x += Math.cos(c.angle) * c.speed;
      c.y += Math.sin(c.angle) * c.speed;
    } else {
      // 被抓到
      wanted = 0;
      score = Math.max(0, score - 50);
      cops.length = 0;
      document.getElementById('wanted').textContent = wanted;
      document.getElementById('score').textContent = score;
      player.x = W/2; player.y = H/2; player.speed = 0;
    }
  });
}

// 相機跟隨
function camera(){
  return { x: player.x - W/2, y: player.y - H/2 };
}

function drawCar(x, y, angle, w, h, color){
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(angle);
  ctx.fillStyle = color;
  ctx.fillRect(-w/2, -h/2, w, h);
  ctx.fillStyle = '#222';
  ctx.fillRect(w/2-8, -h/2-2, 6, 4);
  ctx.fillRect(w/2-8, h/2-2, 6, 4);
  ctx.restore();
}

function draw(){
  const cam = camera();
  ctx.fillStyle = '#1a1a1a';
  ctx.fillRect(0,0,W,H);

  ctx.save();
  ctx.translate(-cam.x, -cam.y);

  // 馬路網格
  ctx.strokeStyle = '#333';
  ctx.lineWidth = 2;
  for (let x=0; x<2000; x+=100){
    ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,1200); ctx.stroke();
  }
  for (let y=0; y<1200; y+=100){
    ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(2000,y); ctx.stroke();
  }

  // 地標
  landmarks.forEach(l => {
    ctx.fillStyle = l.color;
    ctx.fillRect(l.x, l.y, l.w, l.h);
    ctx.fillStyle = '#fff';
    ctx.font = '14px sans-serif';
    ctx.fillText(l.name, l.x + 6, l.y + 22);
  });

  // 路人
  pedestrians.forEach(p => {
    if (!p.alive) return;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
    ctx.fillStyle = p.color;
    ctx.fill();
  });

  // 警察
  cops.forEach(c => drawCar(c.x, c.y, c.angle, c.w, c.h, c.color));

  // 玩家
  drawCar(player.x, player.y, player.angle, player.w, player.h, player.color);

  ctx.restore();

  // 小地圖
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.fillRect(W-160, 10, 150, 100);
  ctx.strokeStyle = '#555';
  ctx.strokeRect(W-160, 10, 150, 100);
  const sx = 150/2000, sy = 100/1200;
  landmarks.forEach(l => {
    ctx.fillStyle = l.color;
    ctx.fillRect(W-160 + l.x*sx, 10 + l.y*sy, l.w*sx, l.h*sy);
  });
  ctx.fillStyle = '#f1c40f';
  ctx.beginPath();
  ctx.arc(W-160 + player.x*sx, 10 + player.y*sy, 3, 0, Math.PI*2);
  ctx.fill();
}

function loop(){
  update();
  draw();
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
